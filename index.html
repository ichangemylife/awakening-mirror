<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Awakening Mirror</title>
<meta name="description" content="A self-inquiry form. No scoring. No categories. No result. Only a mirror.">
<style>
  :root {
    --bg: #f6f1e7;
    --bg-glow: #fffaf0;
    --ink: #2a2622;
    --ink-soft: #6b625a;
    --line: #d9cfbf;
    --accent: #a4572b;
    --field: rgba(255, 255, 255, 0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12100e;
      --bg-glow: #1d1914;
      --ink: #ece4d6;
      --ink-soft: #9a9083;
      --line: #35302a;
      --accent: #e0915c;
      --field: rgba(255, 255, 255, 0.04);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12100e;
    --bg-glow: #1d1914;
    --ink: #ece4d6;
    --ink-soft: #9a9083;
    --line: #35302a;
    --accent: #e0915c;
    --field: rgba(255, 255, 255, 0.04);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-glow), var(--bg) 60%) fixed;
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 19px;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    width: 100%;
    max-width: 640px;
    padding: 56px 16px 96px;
  }
  .progress {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 48px;
  }
  .progress a {
    display: block;
    width: 36px;
    height: 26px;
    padding: 12px 0;
    background: var(--line);
    background-clip: content-box;
    transition: background-color 0.6s, transform 0.3s;
  }
  .progress a.done { background-color: var(--accent); }
  .progress a:hover { background-color: var(--ink); }
  .progress a[aria-current="step"] { transform: scaleY(2); }
  .progress a.locked { opacity: 0.35; cursor: not-allowed; }
  .progress a.locked:hover { background-color: var(--line); }
  .progress a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .screen { display: none; animation: rise 0.9s ease both; }
  .screen.active { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  h1, h2 {
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 20px;
  }
  h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); }
  h2 { font-size: clamp(1.7rem, 5vw, 2.2rem); }
  .lede { color: var(--ink-soft); font-style: italic; margin: 0 0 40px; }
  .intro p { margin: 0 0 14px; }

  .question { margin: 0 0 40px; }
  .question label {
    display: block;
    margin-bottom: 12px;
  }
  .qnum {
    color: var(--accent);
    margin-right: 0.5em;
    font-variant-numeric: tabular-nums;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    padding: 14px 16px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  .actions { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
  button {
    font: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    padding: 12px 28px;
    color: var(--bg);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, opacity 0.6s;
  }
  button:hover { background: var(--accent); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button.quiet {
    background: transparent;
    color: var(--ink-soft);
    border-color: transparent;
    padding-left: 8px;
    padding-right: 8px;
  }
  button.quiet:hover { color: var(--ink); background: transparent; }

  .silence { text-align: center; }
  .silence .instruction { color: var(--ink-soft); font-style: italic; max-width: 30em; margin: 0 auto 32px; }
  .echo {
    margin: 0 auto 48px;
    max-width: 30em;
    padding: 0 0 0 18px;
    border-left: 2px solid var(--accent);
    text-align: left;
    white-space: pre-wrap;
  }
  .echo:empty { display: none; }
  .echo-q { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 6px; font-style: italic; }
  .breath {
    width: 120px;
    height: 120px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%);
    animation: breathe 10s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.55); opacity: 0.5; }
    40% { transform: scale(1.15); opacity: 1; }
    55% { transform: scale(1.15); opacity: 1; }
  }
  .breath-label {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    min-height: 1.5em;
    margin-bottom: 20px;
  }
  .timer {
    font-size: 1.6rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    min-height: 1.6em;
    margin-bottom: 40px;
  }
  .reveal-btn { opacity: 0; pointer-events: none; }
  .reveal-btn.ready { opacity: 1; pointer-events: auto; }

  .closing blockquote {
    margin: 0;
    padding: 0 0 0 22px;
    border-left: 2px solid var(--accent);
    font-size: 1.35rem;
    line-height: 1.55;
  }
  .closing blockquote strong { font-weight: 600; }
  .closing .small { margin-top: 48px; color: var(--ink-soft); font-size: 0.9rem; }

  .privacy {
    margin-top: 64px;
    color: var(--ink-soft);
    font-size: 0.8rem;
    text-align: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  button.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
    padding: 10px 20px;
  }
  button.ghost:hover { background: transparent; color: var(--accent); border-color: var(--accent); }
  [hidden] { display: none !important; }

  .answers-stage { margin: 0 0 40px; }
  .answers-stage h3 {
    font-weight: 400;
    font-size: 1.15rem;
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .answers-stage h3 span { color: var(--accent); margin-right: 0.6em; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .qa { margin: 0 0 22px; }
  .qa .q { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 4px; }
  .qa .a { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa .a.empty { color: var(--ink-soft); font-style: italic; }
  .silence-note { color: var(--ink-soft); font-style: italic; font-size: 0.9rem; margin: 0 0 40px; }
  .answers-closing {
    margin: 48px 0 0;
    padding: 0 0 0 18px;
    border-left: 2px solid var(--accent);
    font-weight: 600;
  }
  .export { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); }
  .export h3 { font-weight: 400; font-size: 1.05rem; margin: 0 0 4px; }
  .export p { margin: 0 0 16px; color: var(--ink-soft); font-size: 0.85rem; }
  .export-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .status { min-height: 1.5em; margin: 12px 0 0; color: var(--accent); font-size: 0.85rem; }
  .nav-row { margin-top: 40px; }

  .sub { color: var(--ink-soft); font-size: 0.6em; }
  .lang { display: flex; justify-content: flex-end; gap: 4px; margin: -28px 0 20px; }
  .lang button { padding: 4px 10px; font-size: 0.8rem; font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", Arial, sans-serif; }
  .lang button[aria-pressed="true"] { color: var(--accent); border-color: var(--line); }

  /* Japanese: no italics, strict line breaking, dots for emphasis. */
  :lang(ja) body { line-height: 1.9; line-break: strict; word-break: auto-phrase; }
  :lang(ja) em { font-style: normal; text-emphasis: filled dot; text-emphasis-position: over right; }
  :lang(ja) .lede, :lang(ja) .silence .instruction, :lang(ja) .echo-q,
  :lang(ja) .qa .a.empty, :lang(ja) .silence-note { font-style: normal; }
  :lang(ja) .eyebrow, :lang(ja) .breath-label { letter-spacing: 0.12em; }

  @page { margin: 20mm 22mm; }
  @media print {
    .lang { display: none !important; }
    html, body { background: #fff !important; }
    body { display: block; font-size: 12pt; }
    * { color: #000 !important; animation: none !important; }
    main { max-width: none; padding: 0; }
    .progress, .privacy, .actions, .export, .nav-row, .screen { display: none !important; }
    .screen.printable { display: block !important; }
    .qa .q, .answers-stage h3 span { color: #444 !important; }
    .qa { break-inside: avoid; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    .breath { animation: none; transform: scale(0.9); }
  }
</style>
</head>
<body>
<main>
  <div class="lang" role="group" id="langSwitch" data-i18n-aria="language">
    <button type="button" class="quiet" data-lang="en" lang="en">EN</button>
    <button type="button" class="quiet" data-lang="fr" lang="fr">FR</button>
    <button type="button" class="quiet" data-lang="ja" lang="ja">日本語</button>
  </div>
  <nav class="progress" id="progress" data-i18n-aria="progress"></nav>

  <section class="screen intro active" data-screen="0" aria-labelledby="t0">
    <p class="eyebrow" data-i18n="introEyebrow"></p>
    <h1 id="t0" data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <p data-i18n="introBody"></p>
    <div class="actions" style="margin-top:40px">
      <button type="button" data-next data-i18n="begin"></button>
      <button type="button" class="quiet" id="viewSaved" data-goto="answers" data-i18n="returnAnswers" hidden></button>
    </div>
  </section>

  <section class="screen" data-screen="1" aria-labelledby="t1">
    <p class="eyebrow" data-stage="1"></p>
    <h2 id="t1" data-i18n-html="s1title"></h2>
    <div class="question"><label for="q1"><span class="qnum">1.</span><span data-i18n-html="q1"></span></label><textarea id="q1" data-q></textarea></div>
    <div class="question"><label for="q2"><span class="qnum">2.</span><span data-i18n-html="q2"></span></label><textarea id="q2" data-q></textarea></div>
    <div class="question"><label for="q3"><span class="qnum">3.</span><span data-i18n-html="q3"></span></label><textarea id="q3" data-q></textarea></div>
    <div class="question"><label for="q4"><span class="qnum">4.</span><span data-i18n-html="q4"></span></label><textarea id="q4" data-q></textarea></div>
    <div class="actions"><button type="button" data-next data-i18n="next"></button><button type="button" class="quiet" data-back data-i18n="back"></button></div>
  </section>

  <section class="screen" data-screen="2" aria-labelledby="t2">
    <p class="eyebrow" data-stage="2"></p>
    <h2 id="t2" data-i18n-html="s2title"></h2>
    <div class="question"><label for="q5"><span class="qnum">5.</span><span data-i18n-html="q5"></span></label><textarea id="q5" data-q></textarea></div>
    <div class="question"><label for="q6"><span class="qnum">6.</span><span data-i18n-html="q6"></span></label><textarea id="q6" data-q></textarea></div>
    <div class="question"><label for="q7"><span class="qnum">7.</span><span data-i18n-html="q7"></span></label><textarea id="q7" data-q></textarea></div>
    <div class="actions"><button type="button" data-next data-i18n="next"></button><button type="button" class="quiet" data-back data-i18n="back"></button></div>
  </section>

  <section class="screen" data-screen="3" aria-labelledby="t3">
    <p class="eyebrow" data-stage="3"></p>
    <h2 id="t3" data-i18n-html="s3title"></h2>
    <div class="question"><label for="q8"><span class="qnum">8.</span><span data-i18n-html="q8"></span></label><textarea id="q8" data-q></textarea></div>
    <div class="question"><label for="q9"><span class="qnum">9.</span><span data-i18n-html="q9"></span></label><textarea id="q9" data-q></textarea></div>
    <div class="question"><label for="q10"><span class="qnum">10.</span><span data-i18n-html="q10"></span></label><textarea id="q10" data-q></textarea></div>
    <div class="actions"><button type="button" data-next data-i18n="next"></button><button type="button" class="quiet" data-back data-i18n="back"></button></div>
  </section>

  <section class="screen silence" data-screen="4" data-route="silence" aria-labelledby="t4">
    <p class="eyebrow" data-stage="4"></p>
    <h2 id="t4" data-i18n="s4title"></h2>
    <p class="instruction" data-i18n="silenceInstruction"></p>
    <div class="echo" id="echo" aria-live="off"></div>
    <div class="breath" aria-hidden="true"></div>
    <div class="breath-label" id="breathLabel" aria-hidden="true"></div>
    <div class="timer" id="silenceTimer" role="timer" data-i18n-aria="timerLabel"></div>
    <div class="actions" style="justify-content:center">
      <button type="button" class="quiet" data-back data-i18n="back"></button>
      <button type="button" class="reveal-btn" id="reveal" data-next tabindex="-1" data-i18n="sat"></button>
    </div>
  </section>

  <section class="screen closing" data-screen="5" data-route="closing" aria-labelledby="t5">
    <h2 id="t5" class="eyebrow" style="margin-bottom:24px" data-i18n="closingEyebrow"></h2>
    <blockquote id="closingText"><strong data-i18n="closing"></strong></blockquote>
    <div class="actions" style="margin-top:56px">
      <button type="button" data-goto="answers" data-i18n="seeAnswers"></button>
      <button type="button" class="quiet" data-back data-i18n="back"></button>
    </div>
  </section>

  <section class="screen answers" data-screen="6" data-route="answers" aria-labelledby="t6">
    <p class="eyebrow" data-i18n="mirrorEyebrow"></p>
    <h2 id="t6" data-i18n="answersTitle"></h2>
    <p class="lede" data-i18n="answersLede"></p>
    <div id="answersList"></div>
    <p class="answers-closing" id="answersClosing"></p>

    <div class="export">
      <h3 data-i18n="exportTitle"></h3>
      <p data-i18n="exportHint"></p>
      <div class="export-grid">
        <button type="button" class="ghost" data-export="pdf" data-i18n="exportPdf"></button>
        <button type="button" class="ghost" data-export="csv" data-i18n="exportCsv"></button>
        <button type="button" class="ghost" data-export="copy" data-i18n="exportCopy"></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="actions nav-row">
      <button type="button" class="quiet" data-back data-i18n="back"></button>
      <button type="button" class="quiet" data-edit data-i18n="edit"></button>
      <button type="button" class="quiet" id="restart" data-i18n="restart"></button>
    </div>
  </section>

  <p class="privacy" data-i18n="privacy"></p>
</main>

      restartConfirm: "Cela efface vos réponses. Cliquez à nouveau pour confirmer",

      language: "Langue",
      steps: ["", "Étape 1", "Étape 2", "Étape 3", "Le Silence", "À la place d'un résultat", "Vos réponses"],
      locked: "{name} (s'ouvre après le silence)",
      plainExported: "Exporté le {date}",

    },
    ja: {

      metaDesc: "自己探求のフォーム。採点なし、分類なし、結果なし。ただ鏡があるだけ。",

      lede: "採点はありません。分類もありません。「結果」もありません。ただ、鏡があるだけです。",

      breatheIn: "息を吸って",
      breatheOut: "息を吐いて",
      timerLabel: "静寂の残り時間",
      sat: "座りました",
      closingEyebrow: "結果の代わりに",
      closing: "このフォームに点数はありません。もし「正しく」答えようとしている自分に気づいたなら、まずそこを見つめてください。目覚めとは、いま出会ったその気づきだけです。さあ、それを生きに行きましょう。",
      seeAnswers: "自分の回答を見る",
      mirrorEyebrow: "鏡",
      answersTitle: "あなたの回答",
      answersLede: "あなた自身の言葉だけを、残したままの形で。見せるべき点数はありません。",
      leftEmpty: "空欄",
      silenceNote: "第4段階 — 静寂：問いも言葉もありません。",
      exportTitle: "控えを保存する",
      exportHint: "あなたの端末にだけ保存されます。お好きな形式をお選びください。",
      exportPdf: "印刷 / PDFで保存",
      exportCsv: "表計算ファイル（.csv）",
      exportCopy: "クリップボードにコピー",
      statusCsv: "CSVファイルを保存しました。",
      statusCopied: "クリップボードにコピーしました。",
      statusCopyFail: "ここではコピーできません。代わりにCSVファイルをお試しください。",
      edit: "回答を編集する",
      restart: "回答を手放して、最初からやり直す",
      restartConfirm: "回答が消去されます。もう一度押すと確定します",
      privacy: "あなたの言葉はこのブラウザ内にだけ保存されるため、あとで戻って読み返せます。外部には何も送信されません。",
      progress: "進捗",
      language: "言語",
      steps: ["", "第1段階", "第2段階", "第3段階", "静寂", "結果の代わりに", "あなたの回答"],
      locked: "{name}（静寂のあとに開きます）",
      plainExported: "書き出し日 {date}",
      plainStage: "第{n}段階 — {title}",
      plainSilence: "第4段階 — 静寂",
      plainSilenceNote: "（問いも言葉もありません）",
      plainEmpty: "（空欄）"
    }
  };

  var screens = Array.prototype.slice.call(document.querySelectorAll(".screen"));
  var fields = Array.prototype.slice.call(document.querySelectorAll("[data-q]"));
  var progress = document.getElementById("progress");
  var reveal = document.getElementById("reveal");
  var label = document.getElementById("breathLabel");
  var echo = document.getElementById("echo");
  var status = document.getElementById("status");
  var viewSaved = document.getElementById("viewSaved");
  var restart = document.getElementById("restart");
  var timerEl = document.getElementById("silenceTimer");
  var current = -1;
  var lang = "en";
  var breathState = "";
  var silenceDone = false;
  var silenceTick = null;
  var silenceTimers = [];
  var restartArmed = null;
  var statusTimer = null;

  // ---- language ----------------------------------------------------------------
  function t(key, vars) {
    var s = I18N[lang][key];
    if (s === undefined) s = I18N.en[key];
    if (typeof s === "string" && vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] === undefined ? m : vars[k]; });
    }
    return s;
  }

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved && I18N[saved]) return saved;
    } catch (e) {}
    var browser = (navigator.language || "").slice(0, 2).toLowerCase();
    return I18N[browser] ? browser : "en";
  }

  function applyLang(next) {
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.querySelector('meta[name="description"]').setAttribute("content", t("metaDesc"));

    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-html]"), function (el) {
      el.innerHTML = t(el.getAttribute("data-i18n-html")); // static, trusted strings only
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-stage]"), function (el) {
      el.textContent = t("stage", { n: el.getAttribute("data-stage") });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });

    disarmRestart();
    refreshLocks();
    renderEcho();
    setBreath(breathState);
    if (current === 6) renderAnswers();
    if (current >= 0) updateTitle();
  }

  function updateTitle() {
    var heading = screens[current].querySelector("h1, h2");
    document.title = (current === 0 ? "" : heading.textContent.replace(/\s+/g, " ").trim() + " · ") + t("title");
  }

  // One link per screen after the intro; the hash router does the navigation.
  for (var i = 1; i < screens.length; i++) progress.appendChild(document.createElement("a"));

  // ---- storage -------------------------------------------------------------
  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || "{}");
      fields.forEach(function (f) { if (saved[f.id]) f.value = saved[f.id]; });
    } catch (e) {}
  }
  function save() {
    try {
      var data = {};
      fields.forEach(function (f) { if (f.value) data[f.id] = f.value; });
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
    refreshSavedLink();
  }
  function clearSaved() {
    try { localStorage.removeItem(KEY); localStorage.removeItem(SILENCE_KEY); } catch (e) {}
    silenceDone = false;
    refreshLocks();
  }
  function hasAnswers() {
    return fields.some(function (f) { return f.value.trim(); });
  }
  function refreshSavedLink() {
    viewSaved.hidden = !(hasAnswers() && silenceDone);
  }

  // The closing words and the answers open only once the silence has been sat through.
  function loadSilenceDone() {
    try { silenceDone = localStorage.getItem(SILENCE_KEY) === "1"; } catch (e) {}
  }
  function markSilenceDone() {
    silenceDone = true;
    try { localStorage.setItem(SILENCE_KEY, "1"); } catch (e) {}
    refreshLocks();
    refreshSavedLink();
  }
  function refreshLocks() {
    var names = t("steps");
    Array.prototype.forEach.call(progress.children, function (dot, idx) {
      var name = names[idx + 1];
      var locked = !silenceDone && idx + 1 >= LOCKED_FROM;
      dot.classList.toggle("locked", locked);
      dot.setAttribute("aria-label", name);
      if (locked) {
        dot.removeAttribute("href");
        dot.setAttribute("aria-disabled", "true");
        dot.title = t("locked", { name: name });
      } else {
        dot.href = "#/" + ROUTES[idx + 1];
        dot.removeAttribute("aria-disabled");
        dot.title = name;
      }
    });
  }

  // ---- the question set, read from the page so text lives in one place -------
  function collect() {
    var stages = [];
    [1, 2, 3].forEach(function (n) {
      var sec = screens[n];
      var questions = Array.prototype.map.call(sec.querySelectorAll(".question"), function (box) {
        var lab = box.querySelector("label");
        return {
          number: Number(lab.querySelector(".qnum").textContent.replace(".", "").trim()),
          question: lab.querySelector("[data-i18n-html]").textContent.trim(),
          answer: box.querySelector("textarea").value.trim()
        };
      });
      stages.push({
        stage: n,
        title: sec.querySelector("h2").textContent.replace(/\s+/g, " ").trim(),
        questions: questions
      });
    });
    return stages;
  }
  function closingText() {
    return document.getElementById("closingText").textContent.trim();
  }

  // ---- answers page ----------------------------------------------------------
  function renderAnswers() {
    var list = document.getElementById("answersList");
    list.textContent = "";
    collect().forEach(function (st) {
      var wrap = document.createElement("div");
      wrap.className = "answers-stage";
      var h = document.createElement("h3");
      var tag = document.createElement("span");
      tag.textContent = t("stage", { n: st.stage });
      h.appendChild(tag);
      h.appendChild(document.createTextNode(st.title));
      wrap.appendChild(h);
      st.questions.forEach(function (q) {
        var qa = document.createElement("div");
        qa.className = "qa";
        var qp = document.createElement("p");
        qp.className = "q";
        qp.textContent = q.number + ". " + q.question;
        var ap = document.createElement("p");
        ap.className = q.answer ? "a" : "a empty";
        ap.textContent = q.answer || t("leftEmpty");
        qa.appendChild(qp);
        qa.appendChild(ap);
        wrap.appendChild(qa);
      });
      list.appendChild(wrap);
      if (st.stage === 3) {
        var note = document.createElement("p");
        note.className = "silence-note";
        note.textContent = t("silenceNote");
        list.appendChild(note);
      }
    });
    document.getElementById("answersClosing").textContent = closingText();
  }

  // ---- export ------------------------------------------------------------------
  function stamp() { return new Date().toISOString().slice(0, 10); }

  function toPlainText() {
    var out = [t("title"), t("plainExported", { date: stamp() }), ""];
    collect().forEach(function (st) {
      out.push(t("plainStage", { n: st.stage, title: st.title.toUpperCase() }), "");
      st.questions.forEach(function (q) {
        out.push(q.number + ". " + q.question, q.answer || t("plainEmpty"), "");
      });
    });
    out.push(t("plainSilence"), t("plainSilenceNote"), "", "—", closingText(), "");
    return out.join("\n");
  }
  function csvCell(v) {
    var s = String(v);
    // Neutralise spreadsheet formula injection from free-text answers.
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function toCSV() {
    var rows = [["stage", "stage_title", "number", "question", "answer"]];
    collect().forEach(function (st) {
      st.questions.forEach(function (q) {
        rows.push([st.stage, st.title, q.number, q.question, q.answer]);
      });
    });
    // BOM so Excel reads the UTF-8 (including Japanese) correctly.
    return "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
  }

  function download(name, mime, content) {
    var url = URL.createObjectURL(new Blob([content], { type: mime + ";charset=utf-8" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function say(msg) {
    status.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { status.textContent = ""; }, 4000);
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }

  function doExport(kind) {
    if (kind === "csv") {
      download("awakening-mirror-" + stamp() + ".csv", "text/csv", toCSV());
      say(t("statusCsv"));
    } else if (kind === "pdf") {
      screens[6].classList.add("printable");
      window.print();
      screens[6].classList.remove("printable");
    } else if (kind === "copy") {
      copyText(toPlainText()).then(
        function () { say(t("statusCopied")); },
        function () { say(t("statusCopyFail")); }
      );
    }
  }

  // ---- silence ---------------------------------------------------------------
  function clearSilence() {
    silenceTimers.forEach(clearTimeout);
    silenceTimers = [];
    clearInterval(silenceTick);
  }

  function renderEcho() {
    var answer = document.getElementById("q10").value.trim();
    echo.textContent = "";
    if (current !== 4 || !answer) return;
    var q = document.createElement("p");
    q.className = "echo-q";
    q.textContent = t("echoQ");
    var a = document.createElement("div");
    a.textContent = answer;
    echo.appendChild(q);
    echo.appendChild(a);
  }

  function setBreath(state) {
    breathState = state;
    label.textContent = state === "in" ? t("breatheIn") : state === "out" ? t("breatheOut") : "";
  }

  function startSilence() {
    renderEcho();
    reveal.classList.remove("ready");
    reveal.tabIndex = -1;
    setBreath("");
    var cycle = 0;
    function breathe() {
      setBreath("in");
      silenceTimers.push(setTimeout(function () { setBreath("out"); }, 4500));
      cycle++;
      if (cycle < 6) silenceTimers.push(setTimeout(breathe, 10000));
    }
    breathe();
    function ready() {
      reveal.classList.add("ready");
      reveal.tabIndex = 0;
    }
    // Already sat once: the button is open from the start, but the timer still runs.
    if (silenceDone) ready();

    var end = Date.now() + SILENCE_MS;
    function tick() {
      var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      timerEl.textContent = Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2);
    }
    tick();
    silenceTick = setInterval(tick, 250);
    silenceTimers.push(setTimeout(function () {
      clearInterval(silenceTick);
      timerEl.textContent = "0:00";
      markSilenceDone();
      ready();
    }, SILENCE_MS));
  }

  // ---- screens & routing -----------------------------------------------------
  function routeIndex() {
    var name = location.hash.replace(/^#\/?/, "");
    var idx = ROUTES.indexOf(name);
    if (idx === -1) return 0;
    if (idx >= LOCKED_FROM && !silenceDone) {
      // Rewrite the address in place so Back doesn't bounce off the locked page.
      history.replaceState(null, "", "#/" + ROUTES[4]);
      return 4;
    }
    return idx;
  }

  function render(n, moveFocus) {
    if (n === current) return;
    clearSilence();
    disarmRestart();
    current = n;
    screens.forEach(function (s, idx) { s.classList.toggle("active", idx === n); });
    Array.prototype.forEach.call(progress.children, function (dot, idx) {
      dot.classList.toggle("done", idx < n);
      if (idx === n - 1) dot.setAttribute("aria-current", "step");
      else dot.removeAttribute("aria-current");
    });
    if (n === 4) startSilence();
    else renderEcho();
    if (n === 6) renderAnswers();
    if (n === 0) refreshSavedLink();
    updateTitle();
    window.scrollTo({ top: 0, behavior: "auto" });
    var heading = screens[n].querySelector("h1, h2");
    if (moveFocus && heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
  }

  // Every step is a hash change, so the browser's own back/forward buttons work too.
  function go(n) {
    var target = "#/" + ROUTES[n];
    if (location.hash === target) render(n, true);
    else location.hash = target;
  }

  window.addEventListener("hashchange", function () { render(routeIndex(), true); });

  function goBack() { go(Math.max(0, current - 1)); }

  // ---- restart (two-step, avoids a blocking confirm dialog) --------------------
  function disarmRestart() {
    if (restartArmed) { clearTimeout(restartArmed); restartArmed = null; }
    restart.textContent = t("restart");
  }
  function onRestart() {
    if (!restartArmed) {
      restart.textContent = t("restartConfirm");
      restartArmed = setTimeout(disarmRestart, 5000);
      return;
    }
    disarmRestart();
    fields.forEach(function (f) { f.value = ""; });
    clearSaved();
    refreshSavedLink();
    go(0);
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.lang) applyLang(b.dataset.lang);
    else if (b.hasAttribute("data-next")) go(current + 1);
    else if (b.hasAttribute("data-back")) goBack();
    else if (b.hasAttribute("data-edit")) go(1);
    else if (b.dataset.goto) go(ROUTES.indexOf(b.dataset.goto));
    else if (b.dataset.export) doExport(b.dataset.export);
    else if (b.id === "restart") onRestart();
  });
  fields.forEach(function (f) { f.addEventListener("input", save); });

  load();
  loadSilenceDone();
  applyLang(detectLang());
  refreshSavedLink();
  render(routeIndex(), false);
})();
</script>
